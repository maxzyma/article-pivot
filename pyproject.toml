[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "article-pivot"
version = "0.1.0"
description = "Reusable article extraction, translation, archiving, and publishing pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "maxzyma" }]
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.scripts]
article-pivot = "article_pivot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
